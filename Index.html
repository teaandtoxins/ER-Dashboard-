<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>ER Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0A0E13;--s1:#10161E;--s2:#161E28;--s3:#1D2733;--line:#233040;--line2:#314257;
  --tx:#E6EDF5;--mu:#8D9BAE;--dim:#5D6A7C;
  --acc:#5CC8E8;--acc2:#2E8FB0;
  --crit:#FF4D5E;--high:#FF9A3C;--mod:#F2CC4B;--ok:#3DD68C;--info:#6EA8FF;--pur:#B18CFF;
  --crit-bg:rgba(255,77,94,.13);--high-bg:rgba(255,154,60,.12);--mod-bg:rgba(242,204,75,.10);--ok-bg:rgba(61,214,140,.10);--info-bg:rgba(110,168,255,.12);--pur-bg:rgba(177,140,255,.13);
  --r:8px;
  --fd:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --fb:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:var(--fb);font-size:14px;line-height:1.4;padding-inline:0;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(10,14,19,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb1{display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.brand{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 3px var(--crit-bg);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.shift{display:flex;gap:14px;align-items:baseline;color:var(--mu);font-size:12px;flex-wrap:wrap}
.shift b{color:var(--tx);font-family:var(--fm);font-weight:500;font-size:14px}
.shift .clock{font-size:18px}
.tb-right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sync{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--mu);white-space:nowrap}
.sync.on{color:var(--ok);border-color:rgba(61,214,140,.4)}
.sync.off{color:var(--mod);border-color:rgba(242,204,75,.4)}
.sync.err{color:var(--crit);border-color:rgba(255,77,94,.4)}
select.mode{background:var(--s2);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-size:12px}
.kpis{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.kpis::-webkit-scrollbar{display:none}
.kpi{flex:0 0 auto;display:flex;align-items:baseline;gap:6px;padding:5px 10px;border-radius:6px;background:var(--s1);border:1px solid var(--line);font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.kpi b{font-family:var(--fm);font-size:17px;color:var(--tx);font-weight:500;letter-spacing:0}
.kpi.crit b{color:var(--crit)}.kpi.high b{color:var(--high)}.kpi.mod b{color:var(--mod)}.kpi.ok b{color:var(--ok)}
.kpi.crit.hot{background:var(--crit-bg);border-color:rgba(255,77,94,.45)}
.kpi.high.hot{background:var(--high-bg);border-color:rgba(255,154,60,.4)}
nav#tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
nav#tabs::-webkit-scrollbar{display:none}
nav#tabs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:9px 11px;color:var(--mu);font-family:var(--fd);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
nav#tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
nav#tabs button .c{font-family:var(--fm);font-size:11px;margin-left:5px;padding:1px 5px;border-radius:4px;background:var(--s3);color:var(--mu)}
nav#tabs button .c.hot{background:var(--crit);color:#fff}

/* ---------- layout ---------- */
#main{padding:14px 16px 110px;max-width:1500px;margin:0 auto}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:var(--r);font-size:12px;margin-bottom:12px}
.banner.hw{background:linear-gradient(90deg,rgba(255,77,94,.22),rgba(255,154,60,.10));border:1px solid rgba(255,77,94,.5);font-family:var(--fd);font-size:16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.banner.demo{background:var(--info-bg);border:1px solid rgba(110,168,255,.3);color:#BFD6FF}
.banner.safety{background:var(--s1);border:1px solid var(--line);color:var(--mu)}
.banner.ro{background:var(--mod-bg);border:1px solid rgba(242,204,75,.4);color:var(--mod)}
.grid{display:grid;gap:12px}
.cmd{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1fr)}
.cmd .span2{grid-column:span 2}.cmd .span3{grid-column:1/-1}
.cmd .tall{grid-row:span 2}
@media (max-width:1100px){.cmd{grid-template-columns:1fr 1fr}.cmd .tall{grid-row:auto}.cmd .span2{grid-column:1/-1}}
@media (max-width:700px){.cmd{grid-template-columns:1fr}}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column}
.panel>h3{margin:0;display:flex;align-items:center;gap:8px;padding:10px 12px;font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.panel>h3 .ct{font-family:var(--fm);font-size:12px;font-weight:500;padding:1px 7px;border-radius:4px;background:var(--s3);color:var(--mu);letter-spacing:0}
.panel>h3 .sp{flex:1}
.panel>h3 .lnk{font-family:var(--fb);font-size:11px;font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--acc);background:none;border:0;padding:2px 4px}
.panel.p-crit{border-color:rgba(255,77,94,.55);box-shadow:0 0 0 1px rgba(255,77,94,.15) inset}
.panel.p-crit>h3{color:#FF8591;background:var(--crit-bg)}
.panel.p-high>h3{color:var(--high)}
.panel.p-pur>h3{color:var(--pur)}
.pbody{padding:6px 8px 8px;display:flex;flex-direction:column;gap:4px}
.empty{color:var(--dim);font-size:12px;padding:10px 6px}

/* attention rows */
.att{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:10px 10px;border-radius:6px;background:var(--s2);border-left:4px solid var(--crit);cursor:pointer}
.att.high{border-left-color:var(--high)}.att.moderate{border-left-color:var(--mod)}.att.stable{border-left-color:var(--ok)}
.att .bed{font-family:var(--fm);font-size:22px;font-weight:500;line-height:1;min-width:52px}
.att .ttl{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.att .why{font-size:13px;color:var(--tx);margin-top:3px}
.att .why .arrow{color:var(--acc)}
.att .rs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.att .sc{font-family:var(--fm);font-size:11px;color:var(--mu);text-align:right}
.att:hover{background:var(--s3)}

/* generic rows */
.row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;background:var(--s2);min-width:0}
.row.click{cursor:pointer}.row.click:hover{background:var(--s3)}
.row .bedtag{font-family:var(--fm);font-weight:500;font-size:13px;min-width:38px;color:var(--tx)}
.row .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.row .txt small{display:block;color:var(--mu);font-size:11px}
.row .tm{font-family:var(--fm);font-size:12px;white-space:nowrap}
.row.ov{background:linear-gradient(90deg,var(--crit-bg),var(--s2) 70%)}
.row.ov .tm{color:var(--crit)}
.row.done{opacity:.55}.row.done .txt{text-decoration:line-through}
.bignum{font-family:var(--fm);font-size:30px;line-height:1;font-weight:500}
.stat{display:flex;align-items:center;gap:12px;padding:8px}
.stat p{margin:0;color:var(--mu);font-size:12px}

/* chips & pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;white-space:nowrap;border:1px solid transparent}
.pill.critical,.pill.crit{background:var(--crit);color:#fff}
.pill.high{background:var(--high-bg);color:var(--high);border-color:rgba(255,154,60,.45)}
.pill.moderate{background:var(--mod-bg);color:var(--mod);border-color:rgba(242,204,75,.35)}
.pill.stable{background:var(--ok-bg);color:var(--ok);border-color:rgba(61,214,140,.35)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.pur{background:var(--pur-bg);color:var(--pur)}
.pill.mute{background:var(--s3);color:var(--mu)}
.pill.ov{background:var(--crit-bg);color:#FF8591;border-color:rgba(255,77,94,.4)}
.who{font-family:var(--fm);font-size:11px;padding:2px 6px;border-radius:4px;background:var(--s3);color:var(--mu);white-space:nowrap}
.who.RES{color:var(--acc)}.who.C1{color:#8FE3B5}.who.C2{color:#C5A8FF}.who.OTH{color:var(--mod)}
.st{border:1px solid var(--line2);background:var(--s1);border-radius:5px;font-size:11px;padding:3px 7px;white-space:nowrap}
.st.todo{color:var(--mu)}.st.progress{color:var(--mod);border-color:rgba(242,204,75,.45)}.st.waiting{color:var(--high);border-color:rgba(255,154,60,.45)}.st.done{color:var(--ok);border-color:rgba(61,214,140,.45)}.st.overdue{color:#fff;background:var(--crit);border-color:var(--crit)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;border:1px solid var(--line2);background:var(--s2);padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--s3)}
.btn.pri{background:var(--acc);color:#04202B;border-color:var(--acc);font-weight:600}
.btn.pri:hover{background:#7AD6F0}
.btn.danger{border-color:rgba(255,77,94,.55);color:#FF8591}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#04220F;font-weight:600}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.xl{padding:14px 18px;font-size:17px;font-weight:700}
.btn.ghost{background:none;border-color:transparent;color:var(--acc)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:6px;flex-wrap:wrap}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--s2);border-radius:99px;padding:6px 11px;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--acc2)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#04202B;font-weight:600}
.chip.sug{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.chip.r-critical.on{background:var(--crit);border-color:var(--crit);color:#fff}
.chip.r-high.on{background:var(--high);border-color:var(--high);color:#1d0d00}
.chip.r-moderate.on{background:var(--mod);border-color:var(--mod);color:#1d1600}
.chip.r-stable.on{background:var(--ok);border-color:var(--ok);color:#03200f}

/* ---------- board ---------- */
.zone{margin-bottom:18px}
.zone h2{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-family:var(--fd);font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.zone h2 .zl{width:12px;height:12px;border-radius:3px}
.zone h2 small{font-family:var(--fm);font-size:12px;color:var(--mu);font-weight:400;letter-spacing:0}
.beds{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.hbed{border:1px dashed var(--line2);border-radius:10px;padding:6px;display:grid;gap:6px}
.hbed>.hb{font-family:var(--fm);font-size:11px;color:var(--mu);padding:0 4px}
.hcu-beds{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px 8px 14px;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:3px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:var(--r) 0 0 var(--r);background:var(--ok)}
.card.critical::before{background:var(--crit)}.card.high::before{background:var(--high)}.card.moderate::before{background:var(--mod)}
.card.critical{border-color:rgba(255,77,94,.45)}
.card.flash{box-shadow:0 0 0 2px var(--crit)}
.card:hover{border-color:var(--line2)}
.card .h{display:flex;align-items:center;gap:6px}
.card .h .bd{font-family:var(--fm);font-size:15px;font-weight:500}
.card .h .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu);font-size:12px}
.card .prob{font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.02em;line-height:1.15}
.card .vit{font-family:var(--fm);font-size:12px;color:#CFE3F2}
.card .vit .bad{color:#FF8591}
.card .ln{font-size:12px;color:var(--mu);overflow-wrap:anywhere}
.card .ln b{color:var(--tx);font-weight:500}
.card .ln .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-right:4px}
.card .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}
.card .ft .tm{font-family:var(--fm);font-size:12px}
.card .ft .tm.ov{color:var(--crit)}
.card .ft .sp{flex:1}
.card .acts{display:flex;gap:4px}
.card .acts button{background:var(--s2);border:1px solid var(--line2);border-radius:5px;font-size:11.5px;padding:3px 7px}
.card .flags{display:flex;gap:4px;flex-wrap:wrap}
.card.emptybed{border-style:dashed;background:transparent;color:var(--dim);align-items:center;justify-content:center;min-height:64px;flex-direction:row;gap:8px}
.card.emptybed::before{display:none}
.card.emptybed .bd{font-family:var(--fm)}

/* ---------- lists / tables ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar h2{margin:0 8px 0 0;font-family:var(--fd);font-size:20px;letter-spacing:.07em;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:5px}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:8px 10px;background:var(--s1);border:1px solid var(--line);border-radius:6px}
.trow.ov{border-color:rgba(255,77,94,.55);background:linear-gradient(90deg,var(--crit-bg),var(--s1) 60%)}
.trow .bd{font-family:var(--fm);font-weight:500}
.trow .t small{display:block;color:var(--mu);font-size:11px}
.trow .tm{font-family:var(--fm);font-size:12px;text-align:right;white-space:nowrap}
.trow.done{opacity:.55}
@media (max-width:640px){.trow{grid-template-columns:44px minmax(0,1fr) auto}.trow .hide-s{display:none}}
.section-t{font-family:var(--fd);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:16px 0 6px;display:flex;gap:8px;align-items:center}
.section-t.crit{color:#FF8591}

.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:800px){.cols2{grid-template-columns:1fr}}

/* ---------- sheet / modal ---------- */
.ov-bg{position:fixed;inset:0;background:rgba(3,6,10,.7);z-index:60;display:flex;justify-content:flex-end}
.ov-bg[hidden]{display:none!important}
.sheet{width:min(760px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line2);overflow-y:auto;padding:0 0 calc(40px + env(safe-area-inset-bottom,0px))}
.sheet .sh-h{position:sticky;top:0;z-index:2;background:var(--s1);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;gap:10px;align-items:center}
.sheet .sh-h h2{margin:0;font-family:var(--fd);font-size:20px;letter-spacing:.04em;flex:1;min-width:0}
.sheet .sh-b{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
#modal-bg{z-index:70;align-items:center;justify-content:center;padding:16px}
.modal{width:min(620px,100%);max-height:92%;overflow-y:auto;background:var(--s1);border:1px solid var(--line2);border-radius:12px}
.modal .sh-h{position:sticky;top:0;background:var(--s1);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.modal .sh-h h2{margin:0;flex:1;font-family:var(--fd);font-size:19px;letter-spacing:.04em}
.modal .sh-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.modal .sh-f{position:sticky;bottom:0;background:var(--s1);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:var(--s2);border:1px solid var(--line2);border-radius:6px;width:34px;height:34px;font-size:18px;line-height:1}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:600}
.inp,textarea.inp,select.inp{width:100%;background:var(--s2);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;font-size:14px}
textarea.inp{resize:vertical;min-height:70px;line-height:1.45}
textarea.inp.mono{font-size:12.5px}
.inp:focus{border-color:var(--acc);outline:none}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.vgrid .fld label{font-size:10px}
.vgrid .inp{padding:6px 8px;font-family:var(--fm)}

/* patient detail */
.nnwd{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.nnwd{grid-template-columns:1fr}}
.nn{background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.nn .lbl{display:block;margin-bottom:4px}
.nn.now{border-color:rgba(255,77,94,.5)}.nn.now .lbl{color:#FF8591}
.nn.next .lbl{color:var(--acc)}.nn.wait .lbl{color:var(--high)}.nn.dispo .lbl{color:var(--pur)}
.nn textarea{width:100%;background:transparent;border:0;resize:vertical;min-height:40px;font-size:14px;padding:0;line-height:1.4}
.nn textarea:focus{outline:none}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.qa button{background:var(--s2);border:1px solid var(--line2);border-radius:7px;padding:9px 8px;font-size:13px;text-align:left}
.qa button:hover{border-color:var(--acc2)}
.qa button.hot{border-color:rgba(255,77,94,.6);color:#FF8591}
.box{background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.box h4{margin:0 0 8px;font-family:var(--fd);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);display:flex;gap:8px;align-items:center}
.critbox{background:var(--crit-bg);border:1px solid rgba(255,77,94,.55);border-radius:8px;padding:10px 12px}
.critbox .ct{font-family:var(--fd);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#FF8591}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line2);margin-left:6px}
.tl div{padding:3px 0 3px 12px;position:relative;font-size:13px}
.tl div::before{content:"";position:absolute;left:-5px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--line2)}
.tl .t{font-family:var(--fm);color:var(--mu);font-size:12px;margin-right:8px}
.ck{display:flex;gap:8px;align-items:flex-start;padding:5px 2px;font-size:14px;cursor:pointer}
.ck input{margin-top:3px;width:17px;height:17px;accent-color:var(--acc);flex:0 0 auto}
.ck.done span{color:var(--mu);text-decoration:line-through}

/* output */
.out{background:#070A0E;border:1px solid var(--line2);border-radius:8px;padding:12px;white-space:pre-wrap;font-family:var(--fm);font-size:12.5px;line-height:1.55;overflow-wrap:anywhere}

<script>
/* ================= CORE: utils, store, sync, engines ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const NOW = () => Date.now();
const MIN = 60000;
const pad = n => String(n).padStart(2, '0');
const hm = t => { if (!t) return '--:--'; const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dur = m => { m = Math.abs(Math.round(m)); return m >= 60 ? Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm' : m + ' min'; };
const relT = t => { const m = Math.round((t - NOW()) / MIN); if (m === 0) return 'now'; return m > 0 ? 'in ' + dur(m) : dur(m) + ' overdue'; };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };

const RED = ['R1', 'R2', 'R3', 'R4', 'R5', 'R6'];
const HCU = ['H1', 'H2', 'H3', 'H4', 'H5', 'H6'];
const HSLOTS = HCU.flatMap(b => [b + 'A', b + 'B']);
const ALLBEDS = [...RED, ...HSLOTS];
const bedLabel = b => b && b[0] === 'H' && b.length === 3 ? b.slice(0, 2) + '-' + b[2] : (b || '—');
const RISKS = ['critical', 'high', 'moderate', 'stable'];
const RISKLBL = { critical: 'Critical', high: 'High', moderate: 'Moderate', stable: 'Stable' };
const WHO = { RES: 'Resident', C1: 'CRMI 1', C2: 'CRMI 2', OTH: 'Other dept' };
const CATS = { shock: 'Shock', resp: 'Resp failure / dyspnoea', airway: 'Airway threat', ams: 'Altered sensorium', bleed: 'Active bleeding', acs: 'Chest pain / ACS', stroke: 'Stroke / neuro', seizure: 'Seizure', trauma: 'Trauma', tox: 'Toxicology', metabolic: 'Metabolic / electrolyte', abdomen: 'Surgical abdomen', sepsis: 'Sepsis', other: 'Other' };
const TIMECRIT = ['acs', 'stroke', 'trauma', 'sepsis', 'airway', 'tox'];

/* ---------- store ---------- */
const COLS = ['patients', 'tasks', 'invs', 'refs', 'meta'];
const S = { patients: {}, tasks: {}, invs: {}, refs: {}, meta: {} };
let DB = null, SAMPLE = null, SYNC = 'connecting', READONLY = false, DBLOADED = {}, ALLLOADED = false;
const LSKEY = 'ercc.cache.v1';
let lsTimer = null;
function persistLocal() { clearTimeout(lsTimer); lsTimer = setTimeout(() => lsSet(LSKEY, S), 400); }
function loadLocal() { const j = lsGet(LSKEY, null); if (j) COLS.forEach(c => { if (j[c]) S[c] = j[c]; }); return !!j; }
const wq = {};
function writeDoc(col, id, body) {
  if (!DB) return;
  const k = col + '/' + id;
  wq[k] = (wq[k] || Promise.resolve()).then(() => body === null ? DB.collection(col).doc(id).delete() : DB.collection(col).doc(id).set(body))
    .catch(e => onWriteErr(e, () => writeDoc(col, id, body)));
}
let retried = new WeakSet();
function onWriteErr(e, retry) {
  const c = e && e.code;
  if (c === 'invalid_argument') { if (!READONLY) { READONLY = true; toast('You have view-only access. Changes on this device are not shared.', 1); render(); } }
  else if (c === 'quota_exceeded') toast('Storage full. Discharge or clear old patients to free space.', 1);
  else if (c === 'unavailable' && retry && !retried.has(retry)) { retried.add(retry); setTimeout(retry, 800 + Math.random() * 800); }
  else if (c === 'resource_exhausted') { toast('Saving too fast. Retrying shortly.', 1); setTimeout(retry, 2500); }
  else { SYNC = 'err'; paintSync(); }
}
function put(col, obj) {
  obj.upd = NOW();
  S[col] = { ...S[col], [obj.id]: obj };
  persistLocal(); schedule();
  writeDoc(col, obj.id, clone(obj));
  return obj;
}
function del(col, id) {
  const o = { ...S[col] }; delete o[id]; S[col] = o;
  persistLocal(); schedule(); writeDoc(col, id, null);
}
function upd(col, id, fn) { const cur = S[col][id]; if (!cur) return null; const o = clone(cur); fn(o); return put(col, o); }

/* ---------- sync ---------- */
function paintSync() {
  const el = $('#sync'); if (!el) return;
  const m = { on: ['on', 'Live sync'], off: ['off', 'This device only'], err: ['err', 'Sync error'], connecting: ['', 'Connecting…'] }[SYNC] || ['', SYNC];
  el.className = 'sync ' + m[0]; el.textContent = (READONLY ? 'View only · ' : '') + m[1];
}
async function initSync() {
  const hadLocal = loadLocal();
  schedule();
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  try { SAMPLE = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch (e) { SAMPLE = null; }
  if (!db) {
    SYNC = 'off'; paintSync();
    if (!hadLocal || !Object.keys(S.patients).length) loadDemo(false);
    ALLLOADED = true; schedule(); return;
  }
  DB = db; SYNC = 'on'; paintSync();
  COLS.forEach(col => {
    DB.collection(col).onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
      S[col] = o;
      if (!snap.metadata.fromCache) DBLOADED[col] = true;
      if (!ALLLOADED && COLS.every(c => DBLOADED[c])) ALLLOADED = true;
      persistLocal(); schedule();
    }, err => { SYNC = 'err'; paintSync(); if (err && err.code === 'unavailable') setTimeout(() => location.reload(), 5000); });
  });
  setTimeout(() => { if (!ALLLOADED) { ALLLOADED = true; schedule(); } }, 9000);
}

/* ---------- selectors ---------- */
const active = () => Object.values(S.patients).filter(p => p.active !== false);
const byBed = () => { const m = {}; active().forEach(p => m[p.bed] = p); return m; };
const pOf = id => S.patients[id];
const bedOf = pid => { const p = S.patients[pid]; return p ? p.bed : '—'; };
const isOpen = t => t.status !== 'done' && t.status !== 'cancelled';
const isOver = t => isOpen(t) && t.due && t.due < NOW();
const tasksAll = () => Object.values(S.tasks).filter(t => { const p = pOf(t.pid); return !t.pid || (p && p.active !== false); });
const openTasks = () => tasksAll().filter(isOpen);
const overdueTasks = () => openTasks().filter(isOver).sort((a, b) => a.due - b.due);
const tasksFor = pid => Object.values(S.tasks).filter(t => t.pid === pid);
const invsAll = () => Object.values(S.invs).filter(i => { const p = pOf(i.pid); return p && p.active !== false; });
const INV_PENDING = ['ordered', 'collected', 'processing'];
const pendingInvs = () => invsAll().filter(i => INV_PENDING.includes(i.status));
const readyInvs = () => invsAll().filter(i => i.status === 'available');
const invsFor = pid => Object.values(S.invs).filter(i => i.pid === pid);
const refsAll = () => Object.values(S.refs).filter(r => { const p = pOf(r.pid); return p && p.active !== false; });
const REF_PENDING = ['not_contacted', 'called', 'awaiting'];
const pendingRefs = () => refsAll().filter(r => REF_PENDING.includes(r.status));
const refWait = () => (S.meta.shift && S.meta.shift.refWait) || 30;
const refOverdue = r => REF_PENDING.includes(r.status) && r.requested && (NOW() - r.requested) > refWait() * MIN;
const refsFor = pid => Object.values(S.refs).filter(r => r.pid === pid);
const reassessDue = (win = 5) => openTasks().filter(t => t.kind === 'reassess' && t.due && t.due <= NOW() + win * MIN).sort((a, b) => a.due - b.due);
const docIncomplete = () => active().filter(p => p.doc !== 'complete');
const unreviewedCrit = p => (p.crit || []).filter(c => !c.reviewed);

/* ---------- vitals ---------- */
const VKEYS = [['map', 'MAP', ''], ['sbp', 'SBP', ''], ['dbp', 'DBP', ''], ['hr', 'HR', ''], ['rr', 'RR', ''], ['spo2', 'SpO₂', '%'], ['temp', 'T', '°'], ['gcs', 'GCS', ''], ['grbs', 'GRBS', '']];
function vBad(k, v) {
  v = Number(v); if (v === 0 && k !== 'gcs') return false; if (!isFinite(v)) return false;
  return { map: v < 65 || v > 130, sbp: v < 90 || v > 180, dbp: v > 110, hr: v > 120 || v < 50, rr: v > 24 || v < 10, spo2: v < 92, temp: v >= 38.5 || v < 35, gcs: v < 13, grbs: v < 70 || v > 300 }[k] || false;
}
function vitalsLine(p, html = true) {
  const v = p.v || {}; const out = [];
  let mapv = v.map; if (!mapv && v.sbp && v.dbp) mapv = Math.round((+v.sbp + 2 * +v.dbp) / 3);
  const push = (k, lbl, val, u) => { if (val === undefined || val === '' || val === null) return; const s = lbl + ' ' + val + (u || ''); out.push(html && vBad(k, val) ? '<span class="bad">' + esc(s) + '</span>' : (html ? esc(s) : s)); };
  if (v.sbp && v.dbp) push('sbp', 'BP', v.sbp + '/' + v.dbp, '');
  push('map', 'MAP', mapv, '');
  push('hr', 'HR', v.hr); push('rr', 'RR', v.rr); push('spo2', 'SpO₂', v.spo2, '%'); push('temp', 'T', v.temp, '°'); push('gcs', 'GCS', v.gcs); push('grbs', 'GRBS', v.grbs);
  if (v.support) out.push(html ? esc(v.support) : v.support);
  return out.join(html ? ' <span style="color:var(--dim)">|</span> ' : ' | ');
}
// fix: vBad for BP string
const _vb = vBad; vBad = function (k, v) { if (k === 'sbp' && String(v).includes('/')) return _vb('sbp', String(v).split('/')[0]); return _vb(k, v); };

/* ---------- PRIORITY ENGINE ---------- */
function score(p) {
  const r = []; let s = 0; const v = p.v || {}; const cats = p.cats || [];
  const add = (n, txt, lvl = 'high') => { s += n; r.push({ n, txt, lvl }); };
  s += { critical: 40, high: 22, moderate: 8, stable: 0 }[p.risk] || 0;
  if (cats.includes('airway')) add(40, 'Airway threat', 'crit');
  let mapv = +v.map || (v.sbp && v.dbp ? Math.round((+v.sbp + 2 * +v.dbp) / 3) : 0);
  if (mapv && mapv < 65) add(30, 'MAP ' + mapv, 'crit'); else if (v.sbp && +v.sbp < 90) add(25, 'SBP ' + v.sbp, 'crit');
  if (v.spo2 && +v.spo2 < 88) add(30, 'SpO₂ ' + v.spo2 + '%', 'crit'); else if (v.spo2 && +v.spo2 < 92) add(15, 'SpO₂ ' + v.spo2 + '%');
  if (v.rr && (+v.rr > 30 || +v.rr < 8)) add(15, 'RR ' + v.rr);
  if (v.hr && (+v.hr > 130 || +v.hr < 45)) add(15, 'HR ' + v.hr);
  if (v.gcs && +v.gcs <= 8) add(30, 'GCS ' + v.gcs, 'crit'); else if (v.gcs && +v.gcs < 13) add(12, 'GCS ' + v.gcs);
  if (v.grbs && (+v.grbs < 70)) add(25, 'GRBS ' + v.grbs, 'crit');
  if (cats.includes('bleed')) add(15, 'Active bleeding');
  if (cats.includes('resp') && p.risk !== 'stable') add(10, 'Respiratory failure');
  if (cats.includes('shock') && p.risk !== 'stable') add(10, 'Shock');
  if (p.deteriorating) add(35, 'Deteriorating', 'crit');
  if (cats.some(c => TIMECRIT.includes(c)) && p.risk !== 'stable') add(8, 'Time-critical');
  unreviewedCrit(p).forEach(c => add(30, 'CRITICAL: ' + c.text, 'crit'));
  const ts = tasksFor(p.id).filter(isOpen);
  const ovR = ts.filter(t => isOver(t) && t.kind === 'reassess');
  if (ovR.length) add(18, 'Reassessment overdue ' + dur((NOW() - ovR[0].due) / MIN), 'crit');
  const ovT = ts.filter(t => isOver(t) && t.kind !== 'reassess');
  if (ovT.length) add(Math.min(20, ovT.length * 7), ovT.length + ' task' + (ovT.length > 1 ? 's' : '') + ' overdue');
  const ready = invsFor(p.id).filter(i => i.status === 'available');
  if (ready.length) add(12 * ready.length, ready.map(i => i.name).join(', ') + ' result ready');
  const nowTask = ts.filter(t => t.pri === 'now' && t.assignee === 'RES');
  if (nowTask.length) add(8, 'Pending intervention');
  return { s, r: r.sort((a, b) => b.n - a.n) };
}
function ranked() { return active().map(p => ({ p, ...score(p) })).sort((a, b) => b.s - a.s); }
function actionHint(p) {
  const ts = tasksFor(p.id).filter(isOpen);
  const uc = unreviewedCrit(p); if (uc.length) return 'Review critical result: ' + uc[0].text;
  const oR = ts.filter(t => t.kind === 'reassess' && isOver(t))[0]; if (oR) return 'Reassess NOW — ' + oR.text;
  const rd = invsFor(p.id).filter(i => i.status === 'available')[0]; if (rd) return rd.name + ' ready → review';
  const soon = ts.filter(t => t.due && t.due < NOW() + 10 * MIN).sort((a, b) => a.due - b.due)[0];
  if (soon) return soon.text + ' ' + (soon.due < NOW() ? '(' + relT(soon.due) + ')' : relT(soon.due));
  return p.now || 'Review plan';
}
function attention() { return ranked().filter(x => x.s >= 45 || x.p.risk === 'critical').slice(0, 5); }

/* ---------- workload / mode ---------- */
function load() {
  const act = active();
  return {
    active: act.length, red: act.filter(p => p.bed && p.bed[0] === 'R').length, hcu: act.filter(p => p.bed && p.bed[0] === 'H').length,
    crit: act.filter(p => p.risk === 'critical').length, over: overdueTasks().length, pinv: pendingInvs().length, ready: readyInvs().length,
    pref: pendingRefs().length, refOver: pendingRefs().filter(refOverdue).length, docs: docIncomplete().length, rdue: reassessDue(0).length,
    critUn: act.filter(p => unreviewedCrit(p).length).length
  };
}
function autoHigh(L) {
  const th = (S.meta.shift && S.meta.shift.critTh) || 4;
  let pts = 0;
  if (L.crit >= th) pts += 2; if (L.over >= 5) pts += 2; else if (L.over >= 3) pts++;
  if (L.rdue >= 3) pts++; if (L.ready >= 3) pts++; if (L.refOver >= 2) pts++; if (L.critUn >= 2) pts++;
  return pts >= 3;
}
function effMode() { const m = (S.meta.shift && S.meta.shift.mode) || 'auto'; if (m !== 'auto') return m; return autoHigh(load()) ? 'high' : 'routine'; }

/* ---------- CRMI auto-suggestion ---------- */
const C1W = /vital|bp|pulse|spo|glucose|grbs|sugar|cbg|urine|output|i\/o|ecg|abg|vbg|monitor|temp|med(ication)? prep|prepare|nebul|gcs|pupil|reassess data|position|suction|o2|oxygen/i;
const C2W = /blood|sample|cbc|rft|lft|electrolyte|culture|lab|x-?ray|ct|mri|usg|ultrasound|imaging|report|retrieve|fetch|referral|call|coordinate|procedure|tray|kit|pharmacy|logistic|indent|transfer|porter|consent form|blood bank|crossmatch|group/i;
function suggestWho(text) { if (/^call |refer|review by|icu|surgery|discuss|document|decide|consent/i.test(text) && !/coordinate|fetch/i.test(text)) return 'RES'; if (C1W.test(text)) return 'C1'; if (C2W.test(text)) return 'C2'; return 'RES'; }

/* ---------- mutators ---------- */
function tl(pid, txt, who) { upd('patients', pid, p => { p.tl = (p.tl || []); p.tl.push({ t: NOW(), x: txt + (who && who !== 'RES' ? ' (' + WHO[who] + ')' : '') }); if (p.tl.length > 80) p.tl = p.tl.slice(-80); }); }
function addTask(o) {
  const t = { id: newId('t'), pid: o.pid || '', text: o.text, pri: o.pri || 'soon', assignee: o.assignee || suggestWho(o.text), created: NOW(), due: o.due || NOW() + 30 * MIN, status: 'todo', kind: o.kind || 'task', src: o.src || '' };
  put('tasks', t); return t;
}
function setTaskStatus(id, st) {
  const t = S.tasks[id]; if (!t) return;
  upd('tasks', id, x => { x.status = st; if (st === 'done') { x.doneAt = NOW(); x.doneBy = myRole(); } });
  if (st === 'done' && t.pid) tl(t.pid, (t.kind === 'reassess' ? 'Reassessed: ' : 'Done: ') + t.text, t.assignee);
  if (st === 'done' && t.pid && t.kind === 'reassess' && myRole() === 'RES') setTimeout(() => promptReassessOutcome(t), 50);
}
function myRole() { return lsGet('ercc.role', 'RES'); }

let DEMO_BUSY = false;
async function loadDemo(clearFirst) {
  if (DEMO_BUSY) return; DEMO_BUSY = true;
  try {
    const d = makeDemo(NOW());
    if (clearFirst) await clearAll(true);
    const jobs = [];
    ['patients', 'tasks', 'invs', 'refs', 'meta'].forEach(col => d[col].forEach(o => { o.upd = NOW(); S[col] = { ...S[col], [o.id]: o }; jobs.push([col, o]); }));
    persistLocal(); schedule();
    if (DB) {
      toast('Loading demo shift for everyone…');
      for (let i = 0; i < jobs.length; i += 6) {
        await Promise.all(jobs.slice(i, i + 6).map(([c, o]) => DB.collection(c).doc(o.id).set(clone(o)).catch(e => onWriteErr(e))));
      }
      toast('Demo shift loaded');
    }
  } finally { DEMO_BUSY = false; }
}
async function clearAll(silent) {
  const jobs = [];
  COLS.forEach(c => Object.keys(S[c]).forEach(id => jobs.push([c, id])));
  COLS.forEach(c => S[c] = {});
  persistLocal(); schedule();
  if (DB) for (let i = 0; i < jobs.length; i += 6) await Promise.all(jobs.slice(i, i + 6).map(([c, id]) => DB.collection(c).doc(id).delete().catch(() => { })));
  if (!silent) toast('Board cleared');
}

let VIEW = lsGet('ercc.view', 'cmd');
let TFILTER = 'open';
let BOARDSORT = lsGet('ercc.bsort', 'bed');
let rq = false;
function schedule() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
function busyTyping() { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('#main').contains(a); }

const TABS = [['cmd', 'Command'], ['board', 'Board'], ['tasks', 'Tasks'], ['results', 'Results'], ['refs', 'Referrals'], ['dispo', 'Disposition'], ['notes', 'Documentation'], ['handover', 'Handover'], ['tools', 'Toolbox'], ['ai', 'Ask ER AI']];

function render() {
  paintSync();
  const role = myRole();
  $('#role').value = role;
  $('#mode').value = (S.meta.shift && S.meta.shift.mode) || 'auto';
  paintTop();
  if (busyTyping()) return;
  const main = $('#main');
  if (!ALLLOADED && !Object.keys(S.patients).length) { main.innerHTML = '<div class="startcard"><h1>Connecting…</h1><p>Loading the shared board.</p></div>'; return; }
  if (ALLLOADED && !Object.keys(S.patients).length && !Object.keys(S.meta).length) { main.innerHTML = startScreen(); paintQbar(); return; }
  const sy = window.scrollY;
  if (role !== 'RES') { main.innerHTML = crraView(role); $('#tabs').innerHTML = ''; paintQbar(); window.scrollTo(0, sy); return; }
  paintTabs();
  const V = { cmd: cmdView, board: boardView, tasks: tasksView, results: resultsView, refs: refsView, dispo: dispoView, notes: notesView, handover: handoverView, tools: toolsView, ai: aiView }[VIEW] || cmdView;
  main.innerHTML = banners() + V();
  paintQbar();
  window.scrollTo(0, sy);
  if (VIEW === 'handover') restoreHandover();
  if (VIEW === 'ai') restoreAI();
}

function banners() {
  let h = '';
  if (READONLY) h += '<div class="banner ro">View-only access: you can see the live board but your changes are not saved for others. Ask the owner for edit access.</div>';
  if (S.meta.shift && S.meta.shift.demo) h += '<div class="banner demo">Demo shift: all 18 patients are fictional. <button class="btn sm" data-a="settings">Clear or reload demo</button></div>';
  return h;
}

function paintTop() {
  const sh = S.meta.shift || {}; const L = load();
  $('#sh-start').textContent = sh.start ? hm(sh.start) : '--:--';
  $('#sh-el').textContent = sh.start ? dur((NOW() - sh.start) / MIN).replace(' min', 'm') : '—';
  const k = [
    ['Active', L.active + '<small style="color:var(--dim)">/18</small>', '', 'board'],
    ['Red', L.red + '/6', '', 'board'], ['HCU', L.hcu + '/12', '', 'board'],
    ['Critical', L.crit, 'crit' + (L.crit ? ' hot' : ''), 'cmd'],
    ['Overdue', L.over, 'crit' + (L.over ? ' hot' : ''), 'tasks:overdue'],
    ['Results ready', L.ready, 'high' + (L.ready ? ' hot' : ''), 'results'],
    ['Pending inv', L.pinv, 'mod', 'results'],
    ['Referrals', L.pref, L.refOver ? 'high hot' : 'mod', 'refs'],
    ['Docs pending', L.docs, 'mod', 'notes']];
  $('#kpis').innerHTML = k.map(([l, v, c, go]) => `<div class="kpi ${c}" data-go="${go}">${l} <b>${v}</b></div>`).join('');
}

  const L = load();
  const cnt = { tasks: [L.over, L.over > 0], results: [L.ready, L.ready > 0], refs: [L.pref, L.refOver > 0], notes: [L.docs, false] };
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="${VIEW === k ? 'on' : ''}" data-tab="${k}">${l}${cnt[k] && cnt[k][0] ? `<span class="c ${cnt[k][1] ? 'hot' : ''}">${cnt[k][0]}</span>` : ''}</button>`).join('');
}
function paintQbar() {
  const role = myRole();
  if (role !== 'RES') { $('#qbar').innerHTML = `<button data-a="crra-vitals">Record vitals</button><button data-a="crra-flag" class="pri">⚠ Tell resident</button>`; return; }
  $('#qbar').innerHTML = `<button data-a="capture" class="pri">⚡ Quick capture</button><button data-a="add-patient">+ Patient</button><button data-a="add-task">+ Task</button><button data-a="add-inv">+ Investigation</button><button data-a="add-reassess">+ Reassess</button><button data-a="add-ref">+ Referral</button><button data-a="add-int">+ Intervention</button><button data-a="handover">🟣 Handover</button>`;
}
function startScreen() {
  return `<div class="startcard"><h1>Start a shift</h1><p>The shared board is empty. Load the demo shift to see how the command centre works with 18 fictional patients, or start with an empty board for a real shift.</p>
  <div class="btns" style="justify-content:center"><button class="btn pri xl" data-a="demo">Load demo shift</button><button class="btn xl" data-a="empty-shift">Start empty shift</button></div>
  <p class="hint">Everyone who opens this page sees the same board and updates live.</p></div>`;
}

/* ---------- small renderers ---------- */
const riskPill = r => `<span class="pill ${r}">${RISKLBL[r] || r}</span>`;
const whoTag = w => `<span class="who ${w}">${WHO[w] || w}</span>`;
function stChip(t) { const st = isOver(t) ? 'overdue' : t.status; const L = { todo: 'To do', progress: 'In progress', waiting: 'Waiting', done: 'Done', overdue: 'Overdue' }; return `<button class="st ${st}" data-a="cycle" data-id="${t.id}" title="Tap to change status">${L[st]}</button>`; }
function taskRow(t, opts = {}) {
  const ov = isOver(t); const p = pOf(t.pid);
  return `<div class="row ${ov ? 'ov' : ''} ${t.status === 'done' ? 'done' : ''}"><span class="bedtag">${esc(bedLabel(p && p.bed))}</span>
  <span class="txt">${t.kind === 'reassess' ? '⏰ ' : ''}${esc(t.text)}${opts.sub ? `<small>${opts.sub}</small>` : ''}</span>${whoTag(t.assignee)}
  <span class="tm">${t.status === 'done' ? '✓ ' + hm(t.doneAt) : ov ? dur((NOW() - t.due) / MIN) : hm(t.due)}</span>${opts.nost ? '' : stChip(t)}</div>`;
}
function panel(title, body, cls = '', count = null, link = '') {
  return `<section class="panel ${cls}"><h3>${title}${count !== null ? `<span class="ct">${count}</span>` : ''}<span class="sp"></span>${link}</h3><div class="pbody">${body}</div></section>`;
}
const lnk = (go, txt = 'Open →') => `<button class="lnk" data-go="${go}">${txt}</button>`;

/* ---------- COMMAND ---------- */
function attentionPanel() {
  const at = attention();
  const body = at.length ? at.map(({ p, s, r }) => `<div class="att ${p.risk}" data-open="${p.id}">
    <div class="bed">${esc(bedLabel(p.bed))}</div>
    <div><div class="ttl">${esc(p.problem || p.dx || 'Patient')}</div>
      <div class="why">${esc(r[0] ? r[0].txt : RISKLBL[p.risk])} <span class="arrow">→</span> ${esc(actionHint(p))}</div>
      <div class="rs">${r.slice(1, 4).map(x => `<span class="pill ${x.lvl === 'crit' ? 'ov' : 'mute'}">${esc(x.txt)}</span>`).join('')}</div></div>
    <div class="sc">${riskPill(p.risk)}<br><span title="priority score">P${s}</span></div></div>`).join('') : '<div class="empty">No patient currently meets attention criteria.</div>';
  return panel('🚨 Attention now', body, 'p-crit tall', at.length);
}
function overduePanel(max = 8) {
  const ov = overdueTasks();
  const refs = pendingRefs().filter(refOverdue);
  const invs = pendingInvs().filter(i => i.expected && i.expected < NOW());
  let body = ov.slice(0, max).map(t => taskRow(t)).join('');
  body += refs.map(r => `<div class="row ov click" data-go="refs"><span class="bedtag">${esc(bedLabel(bedOf(r.pid)))}</span><span class="txt">${esc(r.dept)} referral still pending<small>${esc(r.status.replace('_', ' '))}</small></span><span class="tm">${dur((NOW() - r.requested) / MIN)}</span></div>`).join('');
  body += invs.slice(0, 4).map(i => `<div class="row click" data-go="results"><span class="bedtag">${esc(bedLabel(bedOf(i.pid)))}</span><span class="txt">${esc(i.name)} result late<small>${i.status}</small></span><span class="tm" style="color:var(--high)">${dur((NOW() - i.expected) / MIN)}</span></div>`).join('');
  if (!body) body = '<div class="empty">Nothing overdue.</div>';
  return panel('🔥 Overdue', body, 'p-crit', ov.length + refs.length, lnk('tasks:overdue'));
}
function next30Panel() {
  const t = openTasks().filter(t => t.due >= NOW() && t.due <= NOW() + 30 * MIN).sort((a, b) => a.due - b.due);
  return panel('⏰ Next 30 min', t.slice(0, 9).map(x => taskRow(x)).join('') || '<div class="empty">Nothing due in the next 30 minutes.</div>', '', t.length);
}
function reassessPanel() {
  const r = reassessDue(5);
  return panel('⏰ Reassess now', r.map(t => taskRow(t)).join('') || '<div class="empty">No reassessment due.</div>', r.some(isOver) ? 'p-high' : '', r.length);
}
function delegatePanel() {
  const q = w => openTasks().filter(t => t.assignee === w);
  const blk = w => { const l = q(w); const o = l.filter(isOver).length; return `<div class="row click" data-go="tasks:${w}"><span class="who ${w}" style="font-size:13px">${WHO[w]}</span><span class="txt"><b class="num" style="font-size:18px">${l.length}</b> open${o ? ` · <span style="color:var(--crit)">${o} overdue</span>` : ''}<small>${esc(l.sort((a, b) => a.due - b.due).slice(0, 2).map(t => bedLabel(bedOf(t.pid)) + ' ' + t.text).join(' · '))}</small></span></div>`; };
  return panel('👥 Delegate', blk('C1') + blk('C2') + `<div class="btns" style="padding:4px 2px"><button class="btn sm" data-a="add-task" data-who="C1">+ Task to CRMI 1</button><button class="btn sm" data-a="add-task" data-who="C2">+ Task to CRMI 2</button></div>`);
}
function resultsPanel() {
  const r = readyInvs();
  const body = r.map(i => `<div class="row click" data-a="review-inv" data-id="${i.id}"><span class="bedtag">${esc(bedLabel(bedOf(i.pid)))}</span><span class="txt">${esc(i.name)}<small>${i.result ? esc(i.result) : 'Result available'}</small></span><span class="pill ${i.critical ? 'crit' : 'high'}">Review</span></div>`).join('');
  return panel('🧪 Results ready', body || '<div class="empty">No results waiting for review.</div>', r.length ? 'p-high' : '', r.length, lnk('results'));
}
function refsPanel() {
  const r = pendingRefs();
  const body = r.map(x => `<div class="row click ${refOverdue(x) ? 'ov' : ''}" data-go="refs"><span class="bedtag">${esc(bedLabel(bedOf(x.pid)))}</span><span class="txt">${esc(x.dept)}<small>${esc(x.status.replace('_', ' '))}${x.requested ? ' · since ' + hm(x.requested) : ''}</small></span><span class="tm">${x.requested ? dur((NOW() - x.requested) / MIN) : '—'}</span></div>`).join('');
  return panel('📞 Referrals', body || '<div class="empty">No pending referrals.</div>', '', r.length, lnk('refs'));
}
function docsPanel() {
  const d = docIncomplete();
  return panel('📝 Documentation', d.map(p => `<div class="row click" data-a="doc" data-pid="${p.id}"><span class="bedtag">${esc(bedLabel(p.bed))}</span><span class="txt">${esc(p.problem || '')}</span><span class="pill ${p.doc === 'partial' ? 'moderate' : 'mute'}">${p.doc}</span></div>`).join('') || '<div class="empty">All documentation complete.</div>', '', d.length, lnk('notes'));
}
function brainPanel() {
  const t = openTasks().filter(t => t.assignee === 'RES').sort((a, b) => a.due - b.due);
  return panel('🧠 Brain offload', `<div class="hint" style="padding:2px 4px 4px">Everything you would otherwise have to remember.</div>` + t.map(x => taskRow(x)).join('') + `<div class="btns" style="padding:4px 2px"><button class="btn sm" data-a="add-task" data-who="RES">+ Reminder</button><button class="btn sm" data-a="capture">⚡ Quick capture</button></div>`, 'p-pur', t.length);
}
function checkPanel() {
  const list = active().filter(p => (p.risk === 'critical' || p.risk === 'high') && cfSets(p).some(k => cfOpen(p, k) > 0));
  return panel('⚠️ Have I checked?', list.map(p => `<div class="row click" data-a="checks" data-pid="${p.id}"><span class="bedtag">${esc(bedLabel(p.bed))}</span><span class="txt">${cfSets(p).map(k => CF[k].t).join(' · ')}<small>${cfSets(p).reduce((a, k) => a + cfOpen(p, k), 0)} items unchecked</small></span><span class="pill high">Check</span></div>`).join('') || '<div class="empty">Checklists complete for high-risk patients.</div>', '', list.length);
}
function critPanel() {
  const l = ranked().filter(x => x.p.risk === 'critical');
  return panel('🔴 Critical patients', l.map(({ p }) => `<div class="row click" data-open="${p.id}"><span class="bedtag">${esc(bedLabel(p.bed))}</span><span class="txt">${esc(p.problem)}<small class="mono">${vitalsLine(p, false)}</small></span></div>`).join('') || '<div class="empty">None.</div>', '', l.length);
}
function startShiftPanel() {
  const items = ['Take handover bed by bed (open each card)', 'Confirm risk level for every patient', 'Check results ready and pending referrals', 'Assign CRMI 1 and CRMI 2 their queues', 'Set reassessment timers for unstable patients', 'Check airway/resus equipment and drugs'];
  const done = lsGet('ercc.startck', {});
  return panel('▶ Start of shift', items.map((x, i) => `<label class="ck ${done[i] ? 'done' : ''}"><input type="checkbox" data-a="startck" data-i="${i}" ${done[i] ? 'checked' : ''}><span>${x}</span></label>`).join(''), 'span3');
}
function cmdView() {
  const mode = effMode(); const L = load();
  if (mode === 'high') {
    return `<div class="banner hw">🔥 High workload mode · showing only what matters now <span style="flex:1"></span><span class="num" style="font-size:12px;font-weight:400;letter-spacing:0">${L.crit} critical · ${L.over} overdue · ${L.ready} results · ${L.rdue} reassess due</span></div>
    <div class="grid cmd">${attentionPanel()}${overduePanel(10)}${critPanel()}${next30Panel()}${delegatePanel()}</div>`;
  }
  let pre = '';
  if (mode === 'start') pre = `<div class="grid cmd" style="margin-bottom:12px">${startShiftPanel()}</div>`;
  if (mode === 'handover') pre = `<div class="banner" style="background:var(--pur-bg);border:1px solid rgba(177,140,255,.4);color:var(--pur)">Handover mode <button class="btn sm pri" data-a="handover">Generate handover</button><button class="btn sm" data-go="dispo">Disposition queue</button></div>`;
  if (mode === 'resus') pre = `<div class="banner" style="background:var(--crit-bg);border:1px solid rgba(255,77,94,.45)"><b style="font-family:var(--fd);letter-spacing:.06em;text-transform:uppercase">Active resuscitation</b> <span class="btns">${['map', 'si', 'vaso', 'rsi', 'airway', 'fluid'].map(id => `<button class="btn sm" data-tool="${id}">${TOOLS[id].n}</button>`).join('')}</span></div>`;
  return pre + `<div class="grid cmd">${attentionPanel()}${overduePanel()}${reassessPanel()}${next30Panel()}${delegatePanel()}${resultsPanel()}${refsPanel()}${docsPanel()}${checkPanel()}<div class="span3">${brainPanel()}</div></div>
  <div class="banner safety" style="margin-top:12px">Clinical decision support only. Verify calculations, doses, protocols, contraindications, and patient-specific decisions against current institutional protocols and authoritative references.</div>`;
}

/* ---------- BOARD ---------- */
function pCard(p) {
  const ts = tasksFor(p.id).filter(isOpen).sort((a, b) => a.due - b.due);
  const nextR = ts.filter(t => t.kind === 'reassess')[0] || ts[0];
  const pend = [...invsFor(p.id).filter(i => INV_PENDING.includes(i.status) || i.status === 'available').map(i => i.name), ...refsFor(p.id).filter(r => REF_PENDING.includes(r.status)).map(r => r.dept)];
  const uc = unreviewedCrit(p);
  const ov = nextR && isOver(nextR);
  return `<div class="card ${p.risk} ${uc.length ? 'flash' : ''}" data-open="${p.id}">
   <div class="h"><span class="bd">${esc(bedLabel(p.bed))}</span><span class="nm">${esc(p.name || '')} · ${esc(p.age || '?')}${esc(p.sex || '')} · ${esc(p.uid || '')}</span>${riskPill(p.risk)}</div>
   <div class="prob">${esc(p.problem || '')}</div>
   ${uc.length ? `<div class="pill ov" style="align-self:flex-start">⚠ Critical result: ${esc(uc.map(c => c.text).join(', '))}</div>` : ''}
   <div class="vit">${vitalsLine(p) || '<span style="color:var(--dim)">No vitals entered</span>'}</div>
   ${p.dx ? `<div class="ln"><span class="k">Dx</span><b>${esc(p.dx)}</b></div>` : ''}
   ${p.now ? `<div class="ln"><span class="k" style="color:#FF8591">Now</span><b>${esc(p.now)}</b></div>` : ''}
   ${pend.length ? `<div class="ln"><span class="k">Pending</span>${esc(pend.slice(0, 4).join(' | '))}${pend.length > 4 ? ' +' + (pend.length - 4) : ''}</div>` : ''}
   <div class="ft"><span class="tm ${ov ? 'ov' : ''}">⏰ ${nextR ? hm(nextR.due) + (ov ? ' · ' + dur((NOW() - nextR.due) / MIN) + ' late' : '') : '—'}</span>${whoTag(p.owner || 'RES')}<span class="pill ${p.doc === 'complete' ? 'stable' : p.doc === 'partial' ? 'moderate' : 'mute'}">📝 ${p.doc}</span><span class="sp"></span>
   <span class="acts"><button data-a="doc" data-pid="${p.id}">📝 Document</button><button data-a="missing" data-pid="${p.id}">🧠 Missing?</button></span></div></div>`;
}
const emptyCard = b => `<div class="card emptybed" data-a="add-patient" data-bed="${b}"><span class="bd">${bedLabel(b)}</span> empty · + Admit</div>`;
function boardView() {
  const bb = byBed();
  const tb = `<div class="toolbar"><h2>Patient board</h2><div class="chips"><button class="chip ${BOARDSORT === 'bed' ? 'on' : ''}" data-a="bsort" data-v="bed">By bed</button><button class="chip ${BOARDSORT === 'pri' ? 'on' : ''}" data-a="bsort" data-v="pri">By priority</button></div><span style="flex:1"></span><button class="btn pri" data-a="add-patient">+ Patient</button></div>`;
  if (BOARDSORT === 'pri') return tb + `<div class="beds">${ranked().map(x => pCard(x.p)).join('')}</div>`;
  const L = load();
  return tb + `<div class="zone"><h2><span class="zl" style="background:var(--crit)"></span>Red zone <small>${L.red}/6</small></h2><div class="beds">${RED.map(b => bb[b] ? pCard(bb[b]) : emptyCard(b)).join('')}</div></div>
  <div class="zone"><h2><span class="zl" style="background:var(--high)"></span>HCU <small>${L.hcu}/12 · 6 beds × 2</small></h2><div class="beds hcu-beds">${HCU.map(h => `<div class="hbed"><div class="hb">${h}</div>${[h + 'A', h + 'B'].map(b => bb[b] ? pCard(bb[b]) : emptyCard(b)).join('')}</div>`).join('')}</div></div>`;
}

/* ---------- TASKS ---------- */
function tasksView() {
  const F = { open: ['All open', t => isOpen(t)], overdue: ['Overdue', isOver], RES: ['Resident', t => isOpen(t) && t.assignee === 'RES'], C1: ['CRMI 1', t => isOpen(t) && t.assignee === 'C1'], C2: ['CRMI 2', t => isOpen(t) && t.assignee === 'C2'], reassess: ['Reassessments', t => isOpen(t) && t.kind === 'reassess'], done: ['Done', t => t.status === 'done'] };
  const f = F[TFILTER] || F.open;
  let l = tasksAll().filter(f[1]).sort((a, b) => TFILTER === 'done' ? b.doneAt - a.doneAt : a.due - b.due);
  return `<div class="toolbar"><h2>Tasks</h2><div class="chips">${Object.entries(F).map(([k, [n]]) => `<button class="chip ${TFILTER === k ? 'on' : ''}" data-a="tfilter" data-v="${k}">${n} <span class="num">${tasksAll().filter(F[k][1]).length}</span></button>`).join('')}</div><span style="flex:1"></span><button class="btn pri" data-a="add-task">+ Task</button></div>
  <div class="list">${l.map(t => { const p = pOf(t.pid); const ov = isOver(t); return `<div class="trow ${ov ? 'ov' : ''} ${t.status === 'done' ? 'done' : ''}"><span class="bd">${esc(bedLabel(p && p.bed))}</span>
   <span class="t">${t.kind === 'reassess' ? '⏰ ' : ''}${esc(t.text)}<small>${t.pri === 'now' ? '<b style="color:var(--crit)">NOW</b> · ' : ''}created ${hm(t.created)} · due ${hm(t.due)}${t.status === 'done' ? ' · done ' + hm(t.doneAt) + ' by ' + (WHO[t.doneBy] || '') : ''}</small></span>
   <span class="hide-s"><select class="inp" style="padding:3px 6px;font-size:12px;width:auto" data-a="reassign" data-id="${t.id}">${Object.entries(WHO).map(([k, v]) => `<option value="${k}" ${t.assignee === k ? 'selected' : ''}>${v}</option>`).join('')}</select></span>
   <span class="tm">${t.status === 'done' ? '✓' : ov ? '<span style="color:var(--crit)">' + dur((NOW() - t.due) / MIN) + ' late</span>' : relT(t.due)}</span>${stChip(t)}</div>`; }).join('') || '<div class="empty">No tasks here.</div>'}</div>`;
}

/* ---------- RESULTS ---------- */
const INVST = { ordered: 'Ordered', collected: 'Sample collected', processing: 'Processing', available: 'Result available', reviewed: 'Reviewed', actioned: 'Action completed' };
function invRow(i) {
  const p = pOf(i.pid); const late = INV_PENDING.includes(i.status) && i.expected && i.expected < NOW();
  const nxt = { ordered: 'collected', collected: 'processing', processing: 'available' }[i.status];
  let act = '';
  if (nxt) act = `<button class="btn sm" data-a="inv-adv" data-id="${i.id}" data-v="${nxt}">→ ${INVST[nxt]}</button>`;
  if (i.status === 'available') act = `<button class="btn sm pri" data-a="review-inv" data-id="${i.id}">Review</button>`;
  if (i.status === 'reviewed' && i.actionReq) act = `<button class="btn sm" data-a="inv-adv" data-id="${i.id}" data-v="actioned">Mark action done</button>`;
  return `<div class="trow ${late || i.status === 'available' ? 'ov' : ''}"><span class="bd">${esc(bedLabel(p && p.bed))}</span>
  <span class="t">${esc(i.name)}${i.critical ? ' <span class="pill crit">critical</span>' : ''}<small>ordered ${hm(i.ordered)} · expected ${hm(i.expected)}${late ? ' · <b style="color:var(--crit)">' + dur((NOW() - i.expected) / MIN) + ' late</b>' : ''}${i.result ? ' · <b style="color:var(--tx)">' + esc(i.result) + '</b>' : ''}${i.status === 'reviewed' ? (i.actionReq ? ' · action required' : ' · no action') : ''}</small></span>
  <span class="hide-s"><span class="pill ${i.status === 'available' ? 'high' : i.status === 'actioned' || (i.status === 'reviewed' && !i.actionReq) ? 'stable' : 'mute'}">${INVST[i.status]}</span></span><span></span>${act}</div>`;
}
function resultsView() {
  const all = invsAll();
  const rdy = all.filter(i => i.status === 'available');
  const pend = all.filter(i => INV_PENDING.includes(i.status)).sort((a, b) => a.expected - b.expected);
  const act = all.filter(i => i.status === 'reviewed' && i.actionReq);
  const fin = all.filter(i => i.status === 'actioned' || (i.status === 'reviewed' && !i.actionReq));
  return `<div class="toolbar"><h2>Investigations</h2><span style="flex:1"></span><button class="btn" data-a="add-crit">⚠ Critical result</button><button class="btn pri" data-a="add-inv">+ Investigation</button></div>
  <div class="section-t crit">Result ready — review required <span class="pill crit">${rdy.length}</span></div><div class="list">${rdy.map(invRow).join('') || '<div class="empty">None.</div>'}</div>
  <div class="section-t">Reviewed — action pending <span class="pill high">${act.length}</span></div><div class="list">${act.map(invRow).join('') || '<div class="empty">None.</div>'}</div>
  <div class="section-t">Pending <span class="pill mute">${pend.length}</span></div><div class="list">${pend.map(invRow).join('') || '<div class="empty">None.</div>'}</div>
  <div class="section-t">Completed</div><div class="list">${fin.map(invRow).join('') || '<div class="empty">None.</div>'}</div>`;
}

/* ---------- REFERRALS ---------- */
const REFST = { not_contacted: 'Not contacted', called: 'Called', awaiting: 'Awaiting response', reviewed: 'Reviewed', plan: 'Plan documented' };
function refsView() {
  const l = refsAll().sort((a, b) => (REF_PENDING.includes(b.status) - REF_PENDING.includes(a.status)) || ((a.requested || 0) - (b.requested || 0)));
  return `<div class="toolbar"><h2>Referrals</h2><span class="hint">Flag after <input class="inp" style="width:60px;display:inline-block;padding:3px 6px" type="number" id="refwait" value="${refWait()}"> min without response</span><span style="flex:1"></span><button class="btn pri" data-a="add-ref">+ Referral</button></div>
  <div class="list">${l.map(r => { const p = pOf(r.pid); const ov = refOverdue(r); return `<div class="box" style="${ov ? 'border-color:rgba(255,77,94,.55)' : ''}">
   <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b class="num" style="font-size:16px">${esc(bedLabel(p && p.bed))}</b><b style="font-family:var(--fd);font-size:17px;letter-spacing:.04em">→ ${esc(r.dept)}</b><span class="hint">${esc(r.reason)}</span><span style="flex:1"></span>${ov ? '<span class="pill ov">⚠ Referral still pending ' + dur((NOW() - r.requested) / MIN) + '</span>' : ''}</div>
   <div class="chips" style="margin:8px 0">${Object.entries(REFST).map(([k, v]) => `<button class="chip ${r.status === k ? 'on' : ''}" data-a="ref-st" data-id="${r.id}" data-v="${k}">${v}</button>`).join('')}</div>
   <div class="frow"><div class="fld"><label>Doctor contacted</label><input class="inp" data-a="ref-f" data-f="contact" data-id="${r.id}" value="${esc(r.contact)}"></div><div class="fld"><label>Response</label><input class="inp" data-a="ref-f" data-f="response" data-id="${r.id}" value="${esc(r.response)}"></div><div class="fld"><label>Plan</label><input class="inp" data-a="ref-f" data-f="plan" data-id="${r.id}" value="${esc(r.plan)}"></div></div>
   <div class="hint" style="margin-top:6px">Requested ${r.requested ? hm(r.requested) : '— (not yet called)'}${r.calledAt ? ' · called ' + hm(r.calledAt) : ''}</div></div>`; }).join('') || '<div class="empty">No referrals.</div>'}</div>`;
}

/* ---------- DISPOSITION ---------- */

/* ================= ER TOOLBOX ================= */
const f1 = (x, d = 1) => (isFinite(x) ? (+x).toFixed(d) : '—');

const I = (k, l, u, d, opt) => ({ k, l, u, d, opt });

/* --- Resuscitation --- */
C('si', 'Resuscitation', 'Shock index', [I('hr', 'Heart rate', '/min', 120), I('sbp', 'Systolic BP', 'mmHg', 90), I('dbp', 'Diastolic BP', 'mmHg', 60)], v => { const si = v.hr / v.sbp, mp = (v.sbp + 2 * v.dbp) / 3, msi = v.hr / mp; return { r: f1(si, 2), u: '', f: 'SI = HR ÷ SBP ; Modified SI = HR ÷ MAP', x: `Modified SI = ${f1(msi, 2)} (MAP ${f1(mp, 0)})`, i: si >= 1 ? 'SI ≥ 1.0 — associated with higher risk of haemodynamic instability / transfusion need.' : si >= 0.7 ? 'SI 0.7–1.0 — watch closely.' : 'SI < 0.7.' }; });
C('map', 'Resuscitation', 'MAP', [I('sbp', 'Systolic BP', 'mmHg', 90), I('dbp', 'Diastolic BP', 'mmHg', 50)], v => ({ r: f1((v.sbp + 2 * v.dbp) / 3, 0), u: 'mmHg', f: 'MAP = (SBP + 2 × DBP) ÷ 3', i: (v.sbp + 2 * v.dbp) / 3 < 65 ? 'Below common target of 65 mmHg.' : '' }));
C('fluid', 'Resuscitation', 'Fluid bolus volume', [I('wt', 'Weight', 'kg', 60), I('mlkg', 'Dose', 'mL/kg', 30)], v => ({ r: f1(v.wt * v.mlkg, 0), u: 'mL', f: 'Volume = weight × mL/kg', i: 'Reassess after each aliquot (perfusion, lungs, IVC/USG). Caution in heart failure / ESRD.' }));
C('vaso', 'Resuscitation', 'Vasopressor infusion rate', [I('dose', 'Target dose', 'mcg/kg/min', 0.1), I('wt', 'Weight', 'kg', 60), I('mg', 'Drug in syringe', 'mg', 8), I('ml', 'Total volume', 'mL', 50)], v => { const conc = v.mg * 1000 / v.ml; const rate = v.dose * v.wt * 60 / conc; return { r: f1(rate, 1), u: 'mL/h', f: 'Rate (mL/h) = dose (mcg/kg/min) × wt × 60 ÷ concentration (mcg/mL)', x: `Concentration = ${v.mg} mg × 1000 ÷ ${v.ml} mL = ${f1(conc, 0)} mcg/mL`, i: 'Verify dilution and dose against your institution’s infusion chart.' }; });
C('pbw', 'Resuscitation', 'Ventilator: PBW & tidal volume', [I('ht', 'Height', 'cm', 165), I('sex', 'Sex (1=M, 0=F)', '', 1)], v => { const pbw = (v.sex ? 50 : 45.5) + 0.91 * (v.ht - 152.4); return { r: f1(pbw, 1), u: 'kg PBW', f: 'PBW = 50 (M) or 45.5 (F) + 0.91 × (height cm − 152.4)', x: `Vt 6 mL/kg = ${f1(pbw * 6, 0)} mL · 8 mL/kg = ${f1(pbw * 8, 0)} mL`, i: 'Lung-protective ventilation commonly targets 6–8 mL/kg PBW; plateau pressure < 30.' }; });
K('rsi', 'Resuscitation', 'RSI checklist', ['Indication documented; senior informed', 'Airway assessment (LEMON) + ultrasound of neck if needed', 'Pre-oxygenation ≥ 3 min (NRBM + nasal cannula / NIV)', 'Position: ear-to-sternal notch, head up', 'IV ×2, monitoring, EtCO₂ ready', 'Suction on and under pillow', 'Drugs drawn & labelled: induction, paralytic, post-intubation sedation', 'Push-dose pressor ready if haemodynamically unstable', 'Bougie, videolaryngoscope, 2 tube sizes, cuff checked', 'Failed airway plan: SGA → front-of-neck access kit', 'Roles assigned: airway, drugs, cricoid/manipulation, monitor', 'Confirm tube: EtCO₂ waveform, bilateral air entry, CXR']);
K('airway', 'Resuscitation', 'Airway threat checklist', ['Stridor / voice change / drooling?', 'GCS ≤ 8 or falling?', 'Burns / facial trauma / angioedema?', 'Secretions not cleared (OP poisoning, bulbar)?', 'Rising work of breathing despite support?', 'Plan and equipment ready before transport / CT?']);

/* --- Respiratory --- */
C('abg', 'Respiratory', 'ABG analysis', [I('ph', 'pH', '', 7.24), I('pco2', 'pCO₂', 'mmHg', 72), I('hco3', 'HCO₃', 'mmol/L', 30), I('na', 'Na (optional)', 'mmol/L', 138), I('cl', 'Cl (optional)', 'mmol/L', 98), I('alb', 'Albumin (optional)', 'g/dL', 4)], v => {
  let prim = '', comp = '';
  if (v.ph < 7.35) { if (v.pco2 > 45) { prim = 'Respiratory acidosis'; const a = 24 + (v.pco2 - 40) / 10, c = 24 + 3.5 * (v.pco2 - 40) / 10; comp = `Expected HCO₃: acute ≈ ${f1(a)}, chronic ≈ ${f1(c)}`; } else { prim = 'Metabolic acidosis'; const w = 1.5 * v.hco3 + 8; comp = `Winter’s: expected pCO₂ = ${f1(w)} ± 2 → ${v.pco2 > w + 2 ? 'additional respiratory acidosis' : v.pco2 < w - 2 ? 'additional respiratory alkalosis' : 'appropriate'}`; } }
  else if (v.ph > 7.45) { if (v.pco2 < 35) { prim = 'Respiratory alkalosis'; comp = `Expected HCO₃: acute ≈ ${f1(24 - 2 * (40 - v.pco2) / 10)}, chronic ≈ ${f1(24 - 5 * (40 - v.pco2) / 10)}`; } else { prim = 'Metabolic alkalosis'; const e = 0.7 * (v.hco3 - 24) + 40; comp = `Expected pCO₂ ≈ ${f1(e)} ± 5`; } }
  else prim = 'pH normal — check for mixed disorder';
  let ag = ''; if (v.na && v.cl) { const a = v.na - v.cl - v.hco3; const ac = a + 2.5 * (4 - (v.alb || 4)); ag = `AG = ${f1(a)} (albumin-corrected ${f1(ac)}); Δratio = ${f1((ac - 12) / (24 - v.hco3), 2)}`; }
  return { r: prim, u: '', f: 'Winter’s: pCO₂ = 1.5×HCO₃ + 8 ± 2 · AG = Na − (Cl + HCO₃) · corrected AG = AG + 2.5×(4 − albumin)', x: comp + (ag ? ' · ' + ag : ''), i: 'Interpret alongside clinical picture; this is arithmetic support, not a diagnosis.' };
});
C('pf', 'Respiratory', 'P/F ratio', [I('pao2', 'PaO₂', 'mmHg', 80), I('fio2', 'FiO₂', '% or fraction', 40)], v => { const fi = v.fio2 > 1 ? v.fio2 / 100 : v.fio2; const r = v.pao2 / fi; return { r: f1(r, 0), u: '', f: 'P/F = PaO₂ ÷ FiO₂ (fraction)', x: `FiO₂ used = ${fi}`, i: r <= 100 ? '≤ 100: severe (Berlin, if ARDS criteria met)' : r <= 200 ? '101–200: moderate' : r <= 300 ? '201–300: mild' : '> 300' }; });
C('rox', 'Respiratory', 'ROX index', [I('spo2', 'SpO₂', '%', 92), I('fio2', 'FiO₂', '% or fraction', 50), I('rr', 'Resp rate', '/min', 28)], v => { const fi = v.fio2 > 1 ? v.fio2 / 100 : v.fio2; const r = (v.spo2 / fi) / v.rr; return { r: f1(r, 2), u: '', f: 'ROX = (SpO₂ ÷ FiO₂) ÷ RR', i: r >= 4.88 ? '≥ 4.88 (at 2, 6, 12 h HFNC) — lower risk of intubation' : r < 3.85 ? '< 3.85 — high risk of HFNC failure' : 'Indeterminate — reassess' }; });
C('hacor', 'Respiratory', 'HACOR (NIV failure)', [I('hr', 'Heart rate', '/min', 118), I('ph', 'pH', '', 7.28), I('gcs', 'GCS', '', 14), I('pf', 'PaO₂/FiO₂', '', 180), I('rr', 'Resp rate', '/min', 32)], v => {
  const h = v.hr >= 121 ? 1 : 0; const a = v.ph >= 7.35 ? 0 : v.ph >= 7.30 ? 2 : v.ph >= 7.25 ? 3 : 4; const c = v.gcs >= 15 ? 0 : v.gcs >= 13 ? 2 : v.gcs >= 11 ? 5 : 10; const o = v.pf >= 201 ? 0 : v.pf >= 176 ? 2 : v.pf >= 151 ? 3 : v.pf >= 126 ? 4 : v.pf >= 101 ? 5 : 6; const r = v.rr <= 30 ? 0 : v.rr <= 35 ? 1 : v.rr <= 40 ? 2 : v.rr <= 45 ? 3 : 4; const s = h + a + c + o + r;

    case 'save-ref': saveRef(); break;
    case 'add-crit': critForm(d.pid || SHEET_PID || ''); break;
    case 'save-crit': { const pid = chipVal('pid'); const t = val('f-crit'); if (!pid || !t) { toast('Pick patient and enter result', 1); break; } upd('patients', pid, p => { p.crit = p.crit || []; p.crit.push({ id: newId('c'), text: t, t: NOW(), reviewed: false }); }); tl(pid, 'CRITICAL RESULT flagged: ' + t); closeModal(); openPatient(pid); break; }
    case 'crit-rev': { upd('patients', d.pid, p => { const c = (p.crit || []).find(x => x.id === d.cid); if (c) { c.reviewed = true; c.revAt = NOW(); c.action = d.v === 'yes'; } }); const c = (pOf(d.pid).crit || []).find(x => x.id === d.cid); tl(d.pid, 'Critical result reviewed: ' + (c ? c.text : '') + (d.v === 'yes' ? ' — action required' : ' — no action')); if (d.v === 'yes') taskForm(d.pid, 'RES', 'Act on ' + (c ? c.text : 'critical result')); else refreshSheet(); break; }
    case 'cycle': { const t = S.tasks[d.id]; const nx = { todo: 'progress', progress: 'waiting', waiting: 'done', done: 'todo' }[t.status] || 'done'; setTaskStatus(d.id, nx); refreshSheet(); break; }
    case 'set-st': setTaskStatus(d.id, d.v); if (d.v === 'done') toast('Done ✓ — resident can see it'); break;
    case 'tfilter': TFILTER = d.v; render(); break;
    case 'bsort': BOARDSORT = d.v; lsSet('ercc.bsort', d.v); render(); break;
    case 'review-inv': reviewInv(d.id); break;
    case 'inv-review': doInvReview(d.id, d.v === 'yes'); refreshSheet(); break;
    case 'inv-adv': { const i = S.invs[d.id]; upd('invs', d.id, x => { x.status = d.v; if (d.v === 'available') x.availAt = NOW(); }); tl(i.pid, i.name + ': ' + INVST[d.v]); if (d.v === 'available') { toast('RESULT READY — REVIEW REQUIRED'); reviewInv(d.id); } refreshSheet(); break; }
    case 'ref-st': { const r = S.refs[d.id]; upd('refs', d.id, x => { x.status = d.v; if (!x.requested && d.v !== 'not_contacted') x.requested = NOW(); if (d.v === 'called') x.calledAt = NOW(); }); tl(r.pid, r.dept + ' referral: ' + REFST[d.v]); break; }
    case 'dispo-t': upd('patients', d.pid, p => { p.dispoTarget = p.dispoTarget === d.v ? '' : d.v; }); break;
    case 'dispo-ready': upd('patients', d.pid, p => { p.dispoReady = !p.dispoReady; }); tl(d.pid, pOf(d.pid).dispoReady ? 'Marked ready for disposition' : 'Disposition readiness removed'); break;
    case 'dispo-go': confirmBox('Confirm this patient has left the ED? Their bed becomes free and open tasks close.', 'Patient left', () => { const p = pOf(d.pid); tl(d.pid, 'Left ED → ' + (p.dispoTarget || p.dispo || 'disposition')); upd('patients', d.pid, x => { x.active = false; x.leftAt = NOW(); }); tasksFor(d.pid).filter(isOpen).forEach(t => upd('tasks', t.id, x => x.status = 'cancelled')); toast(bedLabel(p.bed) + ' is free'); }); break;
    case 'deteriorate': { const on = !pOf(d.pid).deteriorating; upd('patients', d.pid, p => { p.deteriorating = on; if (on && p.risk !== 'critical') p.risk = 'critical'; }); tl(d.pid, on ? 'DETERIORATING — flagged' : 'Deterioration flag cleared'); if (on) addTask({ pid: d.pid, text: 'Reassess deteriorating patient', assignee: 'RES', due: NOW(), kind: 'reassess', pri: 'now' }); refreshSheet(); break; }
    case 'save-vitals': { const nv = {}; VKEYS.forEach(([k]) => { const x = val('v-' + k); if (x !== '') nv[k] = x; }); const sup = val('v-support'); if (sup) nv.support = sup; upd('patients', d.pid, p => { p.v = nv; p.vAt = NOW(); }); tl(d.pid, 'Vitals: ' + vitalsLine({ v: nv }, false)); toast('Vitals saved'); refreshSheet(); break; }
    case 'tl-add': { const x = val('tl-note'); if (x) { tl(d.pid, x); $('#tl-note').value = ''; setTimeout(refreshSheet, 30); } break; }
    case 'checks': checksModal(d.pid); break;
    case 'missing': missingModal(d.pid); break;
    case 'missing-ai': missingAI(d.pid); break;
    case 'doc': docSheet(d.pid); break;
    case 'doc-gen': { const p = pOf(DOC_PID); $('#d-out').value = draftNote(p, $('#d-free').value, $('#d-use').checked); lsSet('ercc.docdraft.' + DOC_PID, { free: $('#d-free').value, out: $('#d-out').value }); tl(DOC_PID, 'Documentation draft generated'); break; }
    case 'doc-ai': docAI(); break;
    case 'doc-copy': copyText($('#d-out').value, $('#d-out')); break;
    case 'doc-mark': upd('patients', DOC_PID, p => p.doc = d.v); tl(DOC_PID, 'Documentation marked ' + d.v); toast('Documentation: ' + d.v); if (d.v === 'complete') closeModal(); break;
    case 'ai-from': aiLoad(d.pid); break;
    case 'ai-run': aiRun(); break;
    case 'ai-stop': if (AI_CTL) AI_CTL.abort(); break;
    case 'ai-clear': AIF = {}; AIOUT = ''; lsSet('ercc.aif', {}); render(); break;
    case 'capture': captureModal(); break;
    case 'cap-parse': capParse(); break;
    case 'cap-commit': capCommit(); break;
    case 'handover': go('handover'); if (!HO) { HO = buildHandover(); lsSet('ercc.ho', HO); render(); } break;
    case 'ho-gen': HO = buildHandover(); lsSet('ercc.ho', HO); render(); toast('Handover generated — edit before use'); break;
    case 'ho-copy': copyText($('#ho').value, $('#ho')); break;
    case 'ho-mark': active().forEach(p => { if (!p.handover) upd('patients', p.id, x => x.handover = true); }); toast('All patients marked handed over'); break;
    case 'crra-vitals': crraVitals(); break;
    case 'save-cv': saveCV(); break;
    case 'crra-flag': crraFlag(); break;
    case 'save-fl': saveFl(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pf && SHEET_PID) { const f = t.dataset.pf, v = t.value.trim(); upd('patients', SHEET_PID, p => p[f] = v); tl(SHEET_PID, ({ now: 'NOW', next: 'NEXT', waiting: 'WAITING', dispo: 'DISPOSITION', problem: 'Problem', dx: 'Working dx' }[f]) + ': ' + v); return; }
  if (t.dataset.a === 'cf') { upd('patients', t.dataset.pid, p => { p.checks = p.checks || {}; p.checks[t.dataset.k] = t.checked; }); t.parentNode.classList.toggle('done', t.checked); return; }
  if (t.dataset.a === 'startck') { const s = lsGet('ercc.startck', {}); s[t.dataset.i] = t.checked; lsSet('ercc.startck', s); t.parentNode.classList.toggle('done', t.checked); return; }
  if (t.dataset.a === 'reassign') { upd('tasks', t.dataset.id, x => x.assignee = t.value); toast('Reassigned to ' + WHO[t.value]); return; }
  if (t.dataset.a === 'ref-f') { upd('refs', t.dataset.id, x => x[t.dataset.f] = t.value.trim()); if (t.dataset.f === 'response' && t.value.trim()) tl(S.refs[t.dataset.id].pid, S.refs[t.dataset.id].dept + ' response: ' + t.value.trim()); return; }
  if (t.id === 'refwait') { upd('meta', 'shift', m => m.refWait = +t.value || 30); return; }
  if (t.id === 'mode') { if (S.meta.shift) upd('meta', 'shift', m => m.mode = t.value); else put('meta', { id: 'shift', start: NOW(), mode: t.value }); VIEW = 'cmd'; lsSet('ercc.view', 'cmd'); render(); return; }
  if (t.id === 'role') { lsSet('ercc.role', t.value); closeSheet(); window.scrollTo(0, 0); render(); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#modal-bg').hidden) closeModal(); else if (!$('#sheet-bg').hidden) closeSheet(); } if (e.key === 'Enter' && e.target.id === 'tl-note') { const b = $('[data-a="tl-add"]'); if (b) b.click(); } });
$('#btn-settings').onclick = settings;

// sheet live refresh on remote changes
const _render = render; render = function () { _render(); if (!$('#sheet-bg').hidden && SHEET_PID && !rqSheet) { rqSheet = true; setTimeout(() => { rqSheet = false; refreshSheet(); }, 250); } };
let rqSheet = false;
let lastSheetSig = '';
const _refresh = refreshSheet; refreshSheet = function () { if ($('#sheet-bg').hidden || !SHEET_PID) return; const p = pOf(SHEET_PID); const sig = JSON.stringify([p, tasksFor(SHEET_PID), invsFor(SHEET_PID), refsFor(SHEET_PID)]); if (sig === lastSheetSig) return; lastSheetSig = sig; _refresh(); };
const _open = openPatient; openPatient = function (pid) { lastSheetSig = ''; _open(pid); const p = pOf(pid); lastSheetSig = JSON.stringify([p, tasksFor(pid), invsFor(pid), refsFor(pid)]); };

// clock + periodic re-evaluation (overdue states)
setInterval(() => { const d = new Date(); $('#sh-clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }, 1000);
setInterval(() => { if ($('#modal-bg').hidden) schedule(); }, 20000);
try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => { }); } catch (e) { }
initSync();

</script>
